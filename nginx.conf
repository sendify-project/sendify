events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;

        # API Account routes (no auth required for these)
        location /api/account {
            set $upstream_account api-account:80;
            proxy_pass http://$upstream_account;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API Chat routes (auth required)
        location /api/chat {
            auth_request /auth;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $username $upstream_http_x_username;

            set $upstream_chat api-chat:3000;
            proxy_pass http://$upstream_chat;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-Username $username;
        }

        # Socket.io for chat (auth required)
        location /socket.io {
            auth_request /auth;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $username $upstream_http_x_username;

            set $upstream_chat api-chat:3000;
            proxy_pass http://$upstream_chat;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-Username $username;
        }

        # API Upload routes (auth required)
        location /api/upload {
            auth_request /auth;
            auth_request_set $user_id $upstream_http_x_user_id;
            auth_request_set $username $upstream_http_x_username;

            set $upstream_object api-object:5000;
            proxy_pass http://$upstream_object;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-User-Id $user_id;
            proxy_set_header X-Username $username;
        }

        # API Store routes (channels and messages)
        location /api/channel {
            set $upstream_store api-store:80;
            proxy_pass http://$upstream_store;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/channels {
            set $upstream_store api-store:80;
            proxy_pass http://$upstream_store;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/messages {
            set $upstream_store api-store:80;
            proxy_pass http://$upstream_store;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Auth subrequest endpoint
        location = /auth {
            internal;
            set $upstream_account api-account:80;
            proxy_pass http://$upstream_account/api/account/forwardauth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Pass authorization header
            proxy_set_header Authorization $http_authorization;
        }

        # Web client (catch-all)
        location / {
            set $upstream_client web-client:80;
            proxy_pass http://$upstream_client;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
